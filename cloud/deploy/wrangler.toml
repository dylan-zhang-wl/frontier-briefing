# 每日AI科技前沿简报网站（https://wenlongzhang.com/frontier/）的 Cloudflare Worker 配置。说明见同目录 README.md 和 src/index.js 开头。
# 不要在这个文件夹里直接运行 wrangler：用 cloud/deploy/run_wrangler.py，它把这里复制到仓库以外的运行目录
# （本机 ~/.cache/frontier-daily-cloud/worker-run/，Actions 里 $RUNNER_TEMP/frontier-worker-run/），
# 把下面的 __ASSETS_DIR__ 换成上线包目录（cloud/deploy/assemble.py 做的，里面是 frontier/…）再运行，wrangler 的临时文件不进仓库。
name = "frontier-daily"
main = "src/index.js"
compatibility_date = "2026-10-01"
workers_dev = false      # 不开 *.workers.dev 地址（国内常打不开，也少一个入口）
preview_urls = false

# 网址：https://wenlongzhang.com/frontier/ 。主域名和同一域名下的其他路径归别的 Worker；
# 这两条只把 /frontier 开头的地址交给本 Worker，别的路径不受影响（Cloudflare 按最具体的路由匹配）。
# 路由挂在已有的 wenlongzhang.com 上，所以不用建子域名、不用改 DNS。
routes = [
  { pattern = "wenlongzhang.com/frontier", zone_name = "wenlongzhang.com" },
  { pattern = "wenlongzhang.com/frontier/*", zone_name = "wenlongzhang.com" },
]

[assets]
directory = "__ASSETS_DIR__"   # 运行时换成上线包目录（里面是 frontier/…）
binding = "ASSETS"
run_worker_first = true        # 每个请求先过 Worker：补响应头、定缓存、目录给 index.html、音频支持拖动（Range）
html_handling = "none"         # 文件路径原样对应，目录由 Worker 补 index.html
not_found_handling = "none"

# 匿名访问统计（2026-11-10 加）：D1 数据库 frontier-visits（免费版），Worker 里叫 VISITS。
# database_id 是数据库编号，不是机密。表结构在 migrations/（run_wrangler.py d1 migrations apply frontier-visits --remote 执行，
# 见 README.md“访问统计”一节）。只停用统计、不停用网站：删掉下面这一节再发布（页面照常，统计不再记录）。
# 开放程度（11-10 加，src/access.js）的档位和访问口令也存在这个数据库的 site_settings 表（migrations/0002_settings.sql）：
# 存在数据库里，每天自动发布不会把它重置。注意：删掉下面这一节，开放程度也跟着失效，网站按“公开”处理。
[[d1_databases]]
binding = "VISITS"
database_name = "frontier-visits"
database_id = "9c4b487b-11b1-4e8e-aeed-1d3b027b5334"
migrations_dir = "migrations"

# 没有定时任务：账号里的定时（Cron Triggers）已经用了 4 个、上限 5 个。400 天以前的访问记录改在写入时顺手删
# （每写进第 1000、2000……条删一次；站长打开统计页时也删一次），见 src/visits.js 的 cleanupVisits。
#
# 机密变量两个，都不写在这里；以后每次 wrangler deploy 都不会删它们（官方：Wrangler will not delete your secrets unless you run
# wrangler secret delete，https://developers.cloudflare.com/workers/wrangler/configuration/ ）：
# · GH_FEEDBACK_TOKEN：读者反馈转交 GitHub 用（11-10 加），由手动流程 .github/workflows/feedback-setup.yml 写入，说明见 cloud/feedback/README.md。
# · STATS_KEY_HASH：站长钥匙的指纹（SHA-256，64 位十六进制；钥匙本身不在仓库、也不在 Cloudflare），打开统计页 /frontier/_visits 用（11-10 加），
#   由手动流程 .github/workflows/stats-setup.yml 从仓库 Secret STATS_KEY_HASH 写入，说明见 README.md“访问统计”一节。
