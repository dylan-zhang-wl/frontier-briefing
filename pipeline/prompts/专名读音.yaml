# 专名读音清单：配完音转写回来，看专名有没有被念成已知的错读（给 pipeline/tts_qc.py 的 name_misreads 用，2026-11-09 加）
#
# 为什么要有它：对稿（tts_qc.check）按整块字错率判，一个名字念错只多一两个错字，拦不住；也不看声调。
#   11-09 播客 Claude 三处转写成 cloud、Gurman 一处转写成 German、"黄仁勋"选用的那条两处转写成"黄仁荀"、
#   只写拼音的 Yao Shunyu 被念怪（转写成"姚书怀"），你耳听确认都念得不对，对稿全放过了。
# 怎么判：原稿这一块里有"写法"，转写里却出现了"已知误读"（比原稿里本来就有的同一个词多出来的才算，
#   免得原稿真写了 Google Cloud 也被算成 Claude 念错），这一块就算"要重录"，自动重录一次（和多念、漏念同一套）；
#   重录后还出现，挑好的那条照用，qc.json 那一块写"专名读音（请你耳听）"，不写"念错了"。
#   标了"只提醒: true"的（现在只有 Claude）命中时不重录，第一条就照用，qc.json 那一块同样写"专名读音（请你耳听）"。
# 局限（如实写）：转写模型自己也会把念对的名字写错。11-09 实测：Claude 配音写法换成 Klawd 后，整句转写三次里一次是 Claude、
#   两次仍是 Cloud；往期 11-02、11-03、11-06 有 Claude 的块转写也全是 cloud。所以 Claude 这一条重录多半白花钱，
#   11-09 用户同意改成只提醒、不重录（"只提醒: true"），要人耳听了才知道。声调程序判不了，"黄仁荀"这一条只靠转写碰巧写出别的字。
#
# 字段：
#   写法       原稿里的写法（英文按整词、不分大小写；中文按字面）。可以写列表（同一个人的几种写法）
#   已知误读   转写里出现就算念错的写法（规则同上）
#   说明       为什么、哪天见过
#   只提醒     true：命中时不重录，只在 qc.json 那一块写"专名读音（请你耳听）"（转写几乎总写错的名字用，2026-11-09 加）
# 改完跑 ~/.venvs/frontier-daily/bin/python -m unittest pipeline/test_tts_qc_names.py。
# 加一条之前，先用往期的 qc.json 看会不会误报一大片（test_tts_qc_names.py 里有用 11-09 那期验的例子）。

版本: 2026-11-14（加微软〔美软、梅华〕：11-13 你耳听确认念成美软，11-14 整块试配又出现梅华。上一版 2026-11-10 晚（加总经理〔总裁〕：你认定头衔被改是错。同日早些时候加特朗普〔川普〕、GR00T〔GR002 之类〕。上一版 2026-11-09：第一版；同日 Claude 改为只提醒、不重录；同日晚加 Ternus、Thurrock）

名字:
  - 写法: Claude
    已知误读: [cloud, clouds, clud]
    只提醒: true
    说明: 11-10 你耳听试听后定：原写法本来就接近 Klawd，不启用新写法、照原写法，这一条仍只提醒。11-09 播客三处都转写成 cloud，你耳听确认念成了 cloud（/klaʊd/），该念 /klɔːd/。转写模型念对了也常写成 cloud，重录多半白花钱，11-09 用户同意只提醒、不重录。读音表里 Klawd 这个配音写法记着、没启用（待用户耳听后启用），现在配音照原写法 Claude
  - 写法: Gurman
    已知误读: [german]
    说明: 11-09 播客要闻一处转写成 German，你耳听确认像 German；该念硬 g 的 GUR-mən
  - 写法: 黄仁勋
    已知误读: [黄仁荀, 黄仁寻, 黄仁循, 黄仁巡, 黄仁旬, 黄仁询]
    说明: 勋念一声 xūn。11-09 热点一选用的那条两处转写成"黄仁荀"（二声 xún），你耳听觉得声调不对；后面几个是同音的二声字
  - 写法: 姚顺雨
    已知误读: [姚书怀, 姚书游, 姚承宇, 姚淑淮]
    说明: 11-09 事件卡只写拼音 Yao Shunyu，配音把拼音念怪（三条转写成 姚书游、姚承宇、姚书怀）。查实中文名是姚顺雨（读音表有出处），稿子写中文就不会再念拼音；这几条留着防万一
  - 写法: Yao Shunyu
    已知误读: [姚书怀, 姚书游, 姚承宇, 姚淑淮]
    说明: 同上：稿子里要是还写着拼音，转写出这几种就说明念怪了（规矩是写中文名或只说头衔，不念拼音）
  - 写法: [Ternus, John Ternus]
    已知误读: [weston, western, wesdon]
    说明: 苹果 CEO，读 TUR-nəs。11-09 云端那期播客两处（7:33 全名、7:50 只说姓）转写成 Weston，你耳听确认念错了；正式那期音频用本机两个转写模型再转一遍，是 Weston、Weston（large-v3-turbo）和 Weston、Wesdon（medium）。11-09 晚用同样的句子试配 10 条（原写法 4 条），转写都是 Ternus、Turnus、Ternes 这类同音写法，没再出现 Weston：念错是碰上的，不是每次都错。往期 qc.json 里没有别的块报这一条（11-09 晚查过）。待验证：之后每期出现就单列核对
  - 写法: Thurrock
    已知误读: [sorrock, sirrock, soroc, faroc, farrock]
    说明: 英国英格兰埃塞克斯郡的地区，读 THUR-ək（11-09 事件卡 E042：伦敦以东约 24 公里，谷歌拟建数据中心）。11-09 云端那期播客两处（8:23、11:59）转写成 Sorrock、FAROC（审片时另一次转写是 Sirrock），你耳听确认念错了；正式音频用 medium 再转是 SOROC、Farrock，开头的 th 都没了。11-09 晚试配原写法 4 条，转写是 The Rock、Thorak、Thirrock、Thurrock（medium 是 Thorek、Thorac、Thurrock、Thurrock），th 都在。The Rock、Thorak 这类不列进来：可能是念对了、转写模型不认识这个地名。往期 qc.json 里没有别的块报这一条（11-09 晚查过）。待验证：之后每期出现就单列核对
  - 写法: 特朗普
    已知误读: [川普]
    说明: 11-10 云端那期视频 75 秒"特朗普就听过相关的情报简报"，配音程序的转写、审片另跑的转写、本机两个转写模型（large-v3-turbo、medium，整段和单切 75.2–78.4 秒）都是"川普"，你耳听确认配音念的就是"川普"（港台的叫法，不是稿子的写法）。11-10 用同一句、正式那一块的语气试配 4 条（两条照原语气、两条语气末尾加"照稿逐字念"），8 次转写都是"特朗普"：念错是碰上的。往期 qc.json 里原稿有"特朗普"的 5 条转写，只有这一条出现"川普"（11-10 查过）
  - 写法: GR00T
    已知误读: [GR002, GR-002, G2002]
    说明: 英伟达的机器人世界动作模型（11-10 事件卡 E032，NVIDIA 官方博客写 GR00T 2，里面是两个数字 0），读 groot（一个音节）。11-10 云端那期播客 7:00"发布了 GR00T 2"，两个转写模型都是"GR002 2.0"（medium 单切另有一次 G2002），你耳听确认念得不对；这一处从"GR"到"2.0"约 1.5 秒，像是按字母、数字逐个念的，念 groot 的试配只有 0.6–0.7 秒。11-10 原写法试配 2 条，转写是 GR00TR、GROOT2（medium 是 GR00T2、GROOT2），没再出现 GR002，但也约 1.3 秒、不像一个音节的 groot；Groot 这个配音写法记在读音表 GR00T 一条的"配音写法（待启用）"。往期 qc.json 里原稿有 GR00T 的只有 11-10 这一块的两条（11-10 查过）
  - 写法: 总经理
    已知误读: [总裁]
    说明: 头衔被改是事实错（11-10 你认定）。11-10 云端那期播客 10:41 原稿"董事长、总经理胡伟武"，两个转写模型整句、单切都是"董事长兼总裁"，同句试配两条都转写回"总经理"，所以是那一条配音改了头衔；事件卡里没有"总裁"。只算转写里比原稿多出来的"总裁"（原稿本来写着"总裁"的不算），往期 qc.json 只命中这一块
  - 写法: 微软
    已知误读: [美软, 梅华]
    说明: 11-13 云端那期播客第 8 块（要闻，约 8:37–9:25）6 处"微软"，选用的第 3 条云端转写和本机两个转写模型都写成"美软"，你耳听确认念成了"美软"（wēi→měi）。那块第 1、2 条转写 6 处都是"微软"，因音高超出重录；第 3 条音高合格，6 处"美软"只让字错率到 2.8%、没到重录线，就被留下了（经验库第 62 件）。11-14 用 11-13 那块的原稿、原语气整块试配原写法 2 条，第 2 条 6 处两个转写模型都写成"梅华"（本机资料/试验/读音试听_1114b/说明.md）；一条里要么 6 处全对、要么全错。只算转写里比原稿多出来的（原稿本来写着"梅华"这类人名的不算）。往期 qc.json（本机资料 成品、归档、试验下带转写的 36 个，534 条转写，原稿有"微软"的 17 条）只命中 11-13 第 8 块第 3 条这一处（11-14 查）。读音表里"威软"这个配音写法仍只记在待启用
