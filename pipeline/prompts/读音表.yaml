  # Anthropic
  - 写法: Claude
    读音: /klɔːd/，一个音节，像英文 clawed；不念 cloud（/klaʊd/）
    配音写法（待启用）: Klawd
    备注: 11-10 你耳听试听后定：原写法念出来本来就接近 Klawd，不启用，配音照原写法 Claude；Klawd 这一栏只留作记录（程序不认）。以下是当初的实测：11-09 播客三处都转写成 cloud，你耳听确认念成了 cloud；往期 11-02、11-03、11-06 有 Claude 的块转写也全是 cloud。11-09 用 Gemini 庚A（正式的语气）实测 Claude、Clawed、Klawd、Klod 各一句，Claude、Klawd 另各补一句，再配一段和正式块一样长的 Klawd（共 $0.0195，记在测试账本，没进月度账本）。看元音共振峰（F1：嘴张多大）：正式那期念错的三处，元音里 F1 从约 840–880 赫兹往下掉 260–300 赫兹，是滑向 /ʊ/ 的双元音 cloud；Klawd 第一句 F1 只掉 45 赫兹、高位保持约 105 毫秒，而且是唯一被整句转写成 Claude 的；长段落里两处 Klawd 掉 120–150 赫兹、开口也小一些（F1 峰值 665–735），比正式那期更像单元音 /ɔː/。证据不算硬（同一写法两次结果不同，转写也会把念对的写成 Cloud），Klawd 只是候选，待你耳听 本机资料/试验/读音试听_1109/（给人听的 wav，在仓库根目录下、iCloud 同步、不进 git；实验脚本和数据在 mini 的 ~/.cache/frontier-daily/验证/读音实测_1109/） 里的试听再定。启用后：稿子、字幕、网页照写 Claude；Claude Code、Claude Opus 这些里的 Claude 也一起换（按整词换）
  - 写法: Claude Code
