# 读音表：口播稿（播客、视频旁白）里的人名、公司、产品、媒体怎么写
#
# 为什么要有它：配音模型照字念。稿子写"奥尔特曼"，它就按中文念；写"Altman"，它就按英文念。
# 怎么用：
#   · 写稿：写稿指令把这份表附在系统提示后面，主笔照着写；
#   · 写完：python pipeline/lexicon_check.py 稿.md 扫一遍；加 --fix 把表里列出的音译换成规定写法；
#   · 补表：检查会列出"表里还没有的英文名"，按下面的规则定好写法，补进对应的分类。
#
# 每一条的字段（只有"写法"必填）：
#   写法     稿子里怎么写。西方人名写全名
#   之后     人名第二次起怎么写（只说姓）
#   身份     第一次提到时带的身份。职位会变，用之前按当天事件卡核对
#   也可写   同样算对的其他写法，如"Ars"是"Ars Technica"的简称
#   音译     不该出现的中文音译。--fix 时：带"·"的全名换成"写法"，单独的姓换成"之后"
#   应改     不该出现的其他写法。写法是中文的条目，这里放它的英文原名，稿子里出现会被提醒改成中文
#   只提醒   true：--fix 不自动改，只提醒（同一个词在别的说法里可能是对的，如"Intel 3"是制程名）
#   例外     这些固定说法里的"应改"不算错
#   中文名   写法是英文、第一次出现时要补上的中文名（字符串或列表，任一个都算）。口播说"MIT，也就是麻省理工学院"，
#            网页写"MIT（麻省理工学院）"；之后只用英文。lexicon_check 查第一次出现的前后有没有（2026-11-03 加）
#   只改口播稿 true："应改""音译"只在命令行查口播稿时算（总调度第 7 步查播客稿、--fix 自动改）；网页（build_v3）和视频旁白的
#            配音前检查（video3_build）不查，网页、视频照原样。用于不是名字、只影响念法的写法，如"C+ 轮"口播写"C 加轮"（2026-11-05 加）
#   区分大小写 true：这一条的写法、应改按大小写认（平时不分大小写）。用于只差大小写的两种写法，如口播把"Hy4"改成"HY4"（2026-11-06 加）
#   读音     给人看的读音提示，不进稿子
#   配音写法 只在送去配音的那份文字里用的写法（2026-11-07 加）。配音程序 pipeline/tts.py 把这一条的"写法""也可写"
#            换成它再发给配音模型；播客、视频旁白、周日对谈（dialog_tts.py）都经过 tts.py 的同一处，所以三样都生效。
#            稿子文件、字幕、网页、画面，以及读音表检查、稿子检查、配音后的对稿，看到的都还是原来的写法，写稿照写原来的写法。
#            英文写法按整词换（前后紧挨着字母或数字的不换，如 SDRAM 里的 DRAM 不换；DRAM-on-logic 这种连字符复合词里的换）；
#            大小写按"区分大小写"那一栏。用于模型照字念会念错、换个写法就念对的词，如 DRAM 写成 D-RAM（念 dee-ram）。
#            新加或改了这一栏，含这个词的配音块下次配音时内容指纹变了，会重配（花钱）；不含的照旧用缓存
#   配音写法（待启用） 试出来、还没定的配音写法，只记着、程序不认（2026-11-09 加，Claude 的 Klawd）。
#            用户耳听定了，把这一栏名字改成"配音写法"就生效；不用了就删掉这一行
#   备注     其他说明
#
# 来源：2026-10-31 测试版 12 张事件卡（03_事件卡/cards_写稿用.json）里出现的全部人名、公司、
#       产品和媒体，外加规则里举的例子。新名字按同样的规则补。

版本: 2026-11-14 第二轮（用户耳听试配后启用字节跳动的"自节跳动"、传奇的"船奇"：两条的"配音写法（待启用）"改成"配音写法"，只换送去配音的字；微软、版本号 3.8 不动。上一版 2026-11-14 周六维护：微软、字节跳动、传奇各试了配音写法〔Gemini 庚A，记在测试账本，没进月度账本〕，都写在"配音写法（待启用）"、不生效：字节跳动的"自节跳动"2/2 转写对、原写法 2/2 又念错，最有把握；传奇的"船奇"在长块里 1/1 对；微软单句里原写法也没念错、复现不了。版本号"3.8"送配音写成"三点八"也试了，结果不一致，没加。上一版 2026-11-10 晚（Claude 定为不启用 Klawd，照原写法。补 11-10 第 7 步提醒"读音表里还没有"的四个：Fable〔放进产品 Claude Fable 5.2 一条，读音 FAY-bəl〕、GR00T〔英伟达机器人模型，读 groot〕、Marco Rubio〔美国国务卿，事件卡中文写"马可·鲁比奥"〕、LingBot-Touch〔蚂蚁灵波的触觉基础模型〕；GR00T、Fable 各试了配音写法〔Gemini 庚A，记在测试账本，没进月度账本〕：Groot 念成一个音节，但转写只有一条是 Groot，写在"配音写法（待启用）"；Fable 原写法这次都念出来了，没定配音写法。上一版 2026-11-09 晚（补 Thurrock〔地名，读音 THUR-ək〕；John Ternus 补读音 TUR-nəs；两个名字各试三种配音写法〔Gemini 庚A 共 20 条 $0.0496，记在测试账本，没进月度账本〕：原写法这次都没念错、候选没显出更好，都没启用；Ternus 记下 Tur-nus〔单列一条，写在"配音写法（待启用）"〕，Thurrock 没定配音写法。上一版 2026-11-09：补姚顺雨〔事件卡只有拼音 Yao Shunyu，查实中文名、附出处〕、Mark Gurman〔读音、通行译名〕、巴淡岛〔地名，口播写法〕；Claude 记下试出的配音写法 Klawd〔11-09 实测；写在"配音写法（待启用）"，没生效，待用户耳听后启用，配音仍照原写法 Claude〕。上一版 2026-11-07：DRAM 写清读音 dee-ram，配音写法定为 D-RAM，从"按单词读"挪到"其他"；加"配音写法"字段。上一版 2026-11-06：补 11-06 那期"表里还没有"的人名、公司、产品、媒体；口播"设闸"改"设下闸门"、Hy4 按字母念写成"HY4"；加"区分大小写"字段；加规则：参数量写读法、英文名后接动词加逗号））

规则:
  - 西方人名写英文原名。第一次带身份，如"OpenAI 的 CEO Sam Altman"；之后只说"Altman"。
  - 华人名字用中文，如黄仁勋、苏姿丰、陈立武。
  - 公司有通行中文名的用中文（苹果、谷歌、微软、英伟达、英特尔、三星、亚马逊）；没有的用英文（OpenAI、Anthropic、Meta、Reddit、Cursor、Mistral）。
  - 产品、模型和英文媒体用原名（ChatGPT、Gemini、The Verge、Ars Technica）；有通行中文名的媒体用中文（彭博社、路透社、《金融时报》）。
  - 中国公司的产品用它自己的中文名，如千问。
  - CEO、AI、GPU 这类缩写照写字母，按字母读。
  - 名字本来是英文（机构、公司、媒体、人名）的写英文、按英文念；有官方或通行中文名、听众不一定熟悉的（表里标了"中文名"），第一次出现时补上中文：口播说"MIT，也就是麻省理工学院"或"麻省理工学院 MIT"，不用括号；网页中文写"MIT（麻省理工学院）"。之后只用英文。苹果、谷歌这类中文名就是日常叫法的，照旧用中文。（2026-11-03 用户定）
  - 名字本来是中文、没有官方英文名的（如《科创板日报》），中文稿照写中文；英文稿和视频画面英文字用拼音（Kechuangban Ribao），不意译，同 Huxiu、Wujie Dongli。
  - 日本、韩国人名查不到汉字写法的，保留英文拼写（如 Rikiya Takehi），第一次带身份、之后只说姓同西方人名。
  - 播客稿里三位以上的"数字＋B/M/K/T"（参数量、上下文长度）写成中文的亿、万："五千零一十亿参数"（501B）、"一点五万亿个词元"（1.5T）、"十二万八千"（128K）；65B、27B 这类一两位的照写。没改的程序会自动改（spoken_numbers.abbr_to_hanzi，2026-11-06 加）。不写"五百零一 B"：稿子检查（script_check）把它当成 501，对不上事件卡里的 5010 亿，会停下。视频旁白照写 501B，配音前自动念成"五百零一 B"。
  - 口播里两个词以上的英文名后面紧接"发布""推出""宣布"这类动词时，中间加逗号："Ricursive Intelligence，发布了……"；播客稿没加的程序会自动加（lexicon_check 第 8 项，2026-11-06 加）。逗号不够，要中文起句（11-06 晚更正）：视频一章、播客一段、对谈一轮都是单独一次配音请求，开口就是英文名、后面只夹两三个字又接英文的，中间那几个字会被带成英文腔（加了逗号的"Ricursive Intelligence，发布了"照样被转写成 Fabula）；开头先垫六个左右汉字（"前谷歌研究员创立的 Ricursive Intelligence，发布了……"），见《写作指南》第六节。lexicon_check 第 8 项后半只提醒。

