    备注: Anthropic 的模型线（11-10 事件卡 E002，官方博客：Anthropic 升级了 Claude Fable 与 Claude Mythos 两条模型线，发布 Fable 5.2、Mythos 5.2）。11-10 云端那期视频 21 秒"发布了 Claude Fable 5.2"，Fable 整个没念，你耳听确认：本机两个转写模型整句都是"Claude（Cloud）5.2"，从"了"到"5.2"中间只有约 0.3 秒，只够念一个 Claude；单切"发布了"到句末，"发布了"被转写成 Fabula（英文腔），Fable 仍没有。11-10 用 Gemini 庚A、正式那一章的语气试配：原写法 2 条、前面垫"新模型"（事件卡原话"新模型"）2 条，4 条都念出了 Fable（转写 Fable、Fabel、Faber），垫中文没显出更好，没定配音写法，配音照原写法。这种整个英文名被吞掉的，11-10 起对稿另有一道"英文名漏念"（tts_qc.name_drops）：自动重录一次，还在就在 qc.json 那一块写"英文名漏念（请你耳听）"。试听在 本机资料/试验/读音试听_1110/（iCloud 同步、不进 git；脚本和数据在 mini 的 ~/.cache/frontier-daily/验证/读音实测_1110/）
  # 英伟达
  - 写法: GR00T
    读音: groot（/ɡruːt/，一个音节，同英文 Groot）；中间是两个数字 0，不是字母 O，也不按字母、数字逐个念。读法照 11-10 用户给的；英伟达官方怎么念没查（未核实）
    配音写法（待启用）: Groot
    备注: 英伟达的开放机器人世界动作模型，型号如 GR00T 2（11-10 事件卡 E032，NVIDIA 官方博客：在机器人学习大会 CoRL 上发布 GR00T 2）。11-10 云端那期播客 7:00"发布了 GR00T 2"，两个转写模型都是"GR002 2.0"，你耳听确认念得不对；从"GR"到"2.0"约 1.5 秒，像是逐个念的。11-10 用 Gemini 庚A、正式那一块的语气试配三种写法、各两条：原写法 GR00T 2 两条，转写 GR00TR、GROOT2（medium 是 GR00T2、GROOT2），名字连"2"约 1.3 秒，不像一个音节；Groot 2 两条，名字连"2"只有 0.6–0.7 秒，是一个音节，但转写是 Growth 2、Group 2（medium 是 Growth2、Groot 2），只有一条写成 Groot；G-R-zero-zero-T 2 两条，转写 GR00T2、GR0T2（两个模型一样），是按字母念的，不是 groot。按规矩（原写法确实念错、候选两条以上都转写对才启用），Groot 只记在"配音写法（待启用）"，没生效，配音照原写法；你耳听 本机资料/试验/读音试听_1110/ 里的"GR00T_原写法""GR00T_候选Groot"和"正式11-10播客_6分59到7分05"再定（试听是 wav，iCloud 同步、不进 git；脚本和数据在 mini 的 ~/.cache/frontier-daily/验证/读音实测_1110/）。启用后：稿子、字幕、网页照写 GR00T，对稿的专名读音清单会拦 GR002 这一类（专名读音.yaml）
