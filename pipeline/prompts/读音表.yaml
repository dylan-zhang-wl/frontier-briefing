# ───────────────────────────── 其他 ─────────────────────────────
# 不是名字、但口播要按某种写法念的（2026-11-05 加）。标了"只改口播稿"的，网页、视频旁白不改（见文件头的字段说明）。
# 写了"配音写法"的，稿子哪儿都不改，只在送去配音的那份文字里换（2026-11-07 加，见文件头）
其他:
  - 写法: DRAM
    区分大小写: true
    读音: dee-ram（/ˈdiːræm/，两个音节）：D 按字母念，RAM 按单词念（同 RAM）；不是英文单词 dram（烈酒，一个音节）
    配音写法: D-RAM
    备注: 动态随机存取存储器，内存芯片的主流。原来放在"缩写·按单词读"，只说别按字母念，没写清 D 要按字母念；11-07 视频旁白定案章"3D DRAM""DRAM-on-logic"两处都被念成一个音节的 dram（转写成 DREAM、D ream），同一期推手章、定案章作废的那一条念对了，是每次合成碰运气。11-07 用 Gemini 庚A 实测三种配音写法：D-RAM（两条）、D RAM、迪-RAM（各一条），四处、两处、两处都念成 dee-ram（看共振峰：DRAM 前面多出一段 /iː/）；定 D-RAM（连字符让"DRAM-on-logic"这类复合词换完仍连成一个词：D-RAM-on-logic）。MiMo 没测过。稿子、字幕、网页照写 DRAM，配音程序自动换（2026-11-07 加）
  - 写法: C 加轮
    也可写: [C+]
    应改: [C+ 轮, C+轮]
    只改口播稿: true
    备注: 融资轮次。中文口播惯常念"C 加轮"，配音模型照字念"C+"可能念成"C plus"；11-04 三条配音（播客两条、视频一条，Gemini 庚A）实测都念成"C 加"，备用的 MiMo 没测过，口播稿统一写"C 加轮"更稳。网页、视频旁白里仍写"C+ 轮"（11-05 加）
  - 写法: 设下闸门
    应改: [设闸]
    例外: [设闸门, 建设闸]
    只改口播稿: true
    备注: 11-06 的主题词"设闸"三处都没念成 zhá（视频开场、收尾转写成"设斩""设诈"，播客快讯转写成"社长""社砸"，音高是降升，不是第二声）；同一期"闸门"两处都念对了。口播稿自动改成"设下闸门"；视频旁白的字幕和配音是同一份字，程序不改，写稿时就别用"设闸"（写作指南第六节）。网页照原样（2026-11-06 加）
  - 写法: HY4
    应改: [Hy4]
    只改口播稿: true
    区分大小写: true
    读音: 按字母读 H-Y-4
    备注: 腾讯混元的模型 Hy4（见产品）。定成按字母念的依据：11-04 那期配音多数念成 H-Y-4（一处念成 high four）；11-06 播客"腾讯 Hy4"转写成"还为4""还未4""韩位4"，是把 Hy 当成一个音节念了。按字母念不会和别的词混，也和 11-04 多数一致。腾讯官方怎么念没查到（未核实）。口播稿自动改成全大写"HY4"：配音模型一般把全大写的字母串按字母念（11-06 的 NDA、CNBC 都念对了），但"HY4"本身还没实测。不用"H Y 4""H-Y-4"：稿子检查（script_check）要在事件卡里找到稿子的英文名，事件卡写的是 Hy4，大写 HY4 对得上，拆开的对不上，会停下。这一条要"区分大小写"，不然 HY4 会被当成 Hy4 再改一遍。网页、视频照写 Hy4（2026-11-06 加）

  - 写法: 巴淡
    也可写: [巴淡岛]
    应改: [峇淡]
    只改口播稿: true
    读音: bā dàn dǎo
    备注: 地名（读音表没有"地名"一组，暂放这里）。印尼廖内群岛省的岛，和新加坡隔海相望（11-09 事件卡 E035 英文：Batam, the Indonesian island facing Singapore；中文原文写"峇淡（巴淡）"）。口播第一次说"印尼的巴淡岛"，之后可以只说"巴淡岛"：11-09 播客写"和新加坡隔海相望的印度尼西亚巴淡"，你听成了印度。"峇"是生僻字，口播稿自动改成"巴淡"（"峇淡岛"改成"巴淡岛"）；"印尼的""岛"程序加不了，靠写稿（总规矩第 9 条）。网页照原样（2026-11-09 加）
  - 写法: Thurrock
    读音: THUR-ək（/ˈθʌrək/，th 是咬舌音，同 thumb 的开头）；不念 Sorrock、Farrock
    备注: 地名（读音表没有"地名"一组，同巴淡暂放这里）。英国英格兰埃塞克斯郡的地区，在伦敦以东约 24 公里（11-09 事件卡 E042，IT之家转述《连线》：谷歌拟在这里建大型数据中心；事件卡中文写"瑟罗克（Thurrock）"）。口播照写 Thurrock、按英文念；"瑟罗克"是 IT之家的译名，没写进"中文名"（写了第 7 项会要求口播补中文）。11-09 云端那期播客两处（8:23、11:59）转写成 Sorrock、FAROC（审片另一次转写是 Sirrock），你耳听确认念错了；正式音频用 medium 再转是 SOROC、Farrock，开头的 th 都没了；同期视频 72 秒两次转写是 Thurrock、therock。11-09 晚用 Gemini 庚A、正式那两块的语气原文、正式稿的两句（请愿句"……伦敦以东约二十四公里的 Thurrock 建大型数据中心"、结尾句"还有 Thurrock 那座数据中心……"）实测三种写法（共 10 条）：原写法 Thurrock 4 条，large-v3-turbo 转写 The Rock、Thorak、Thirrock、Thurrock，medium 转写 Thorek、Thorac、Thurrock、Thurrock；Thurruck 4 条，turbo 是 Therock、THEROC、Therick、Thurrock，medium 是 Thirrock、THEROC、Thorac、Thorok；Thurr-uck 2 条，turbo 是 Therwick、Curic，medium 是 Thirwork、SORIC（结尾句那条两个模型都没听出 th）。原写法这次 th 都在、转写回 Thurrock 的最多（8 次里 3 次），两个候选都没比它强，所以没定配音写法，配音照写 Thurrock；试听在 本机资料/试验/读音试听_1109b/，待你耳听再定。对稿的专名读音清单会拦 Sorrock、FAROC 这几种（2026-11-09 晚加）。待验证：之后每期出现就按审片清单第 25 项单列核对
  - 写法: 字节跳动
    配音写法: 自节跳动
    备注: 只为配音写法放在这里（不是读音规则，稿子照写字节跳动）。11-13 播客 11:13（第 10 块）你耳听念成"智节跳动"（zì→zhì），11-12 那期 7:11 也有一次。11-14 维护用 Gemini 庚A、11-13 第 10 块的语气原文、正式稿那一句试配：原写法 2 条转写"智节跳动""智洁跳动"（又念错了，复现）；候选"自节跳动"（zì 同音同调）2 条转写都是"字节跳动"。比原写法强，是这次最有把握的一个，但只试了两条、还没人耳听，按规矩先写在待启用（程序不认）；你耳听 本机资料/试验/读音试听_1114/ 的"字节跳动_*"定了，把这一栏名字改成"配音写法"就生效（2026-11-14 加）。**11-14 用户耳听试配，确认"自节跳动"这个写法对，启用**（"配音写法（待启用）"改成"配音写法"）：只换送去配音的字，稿子、字幕、网页、对稿照写字节跳动；只认整个"字节跳动"，单说"字节"的不换
  - 写法: 传奇
    配音写法: 船奇
    备注: 普通词，只为配音写法放在这里（稿子照写传奇）。11-13 播客 2:29（第 3 块）"传奇接替传奇"你耳听念成"禅奇"（chuán→chán）。11-14 维护试配（Gemini 庚A、第 3 块的语气原文）：单句原写法 2 条、"船奇"（chuán 同音同调）2 条，转写全是"传奇"（单句复现不了）；整块第 3 块原写法配 2 次（旧指令、加"逐字照读"那句的新指令各 1 次），转写都是"蝉奇／禅奇"（长块里复现了）；整块把传奇换成"船奇"配 1 次，转写是"传奇"。有希望，但只有 1 条，先写在待启用；你耳听"整块3_旧指令_传奇写成船奇"和"整块3_旧指令"对比再定（2026-11-14 加）。**11-14 用户耳听试配，确认"船奇"这个写法对，启用**（"配音写法（待启用）"改成"配音写法"）：只换送去配音的字，稿子、字幕、网页、对稿照写传奇；"传奇"两个字连着出现就换（"传奇性""传奇人物"也换，念法一样；理论上"自传"后面紧跟"奇"字开头的词也会被换，往期没见过）
  - 写法: Ternus
    配音写法（待启用）: Tur-nus
    备注: 只为配音写法单列，读音和实测结果见人名 John Ternus 一条。人名那一条的"配音写法"会把整个"John Ternus"换成一个词、又不换只说姓的"Ternus"；单列这一个词按整词换，"John Ternus"也会换成"John Tur-nus"。没生效，配音照原写法 Ternus；你耳听定了，把这一栏名字改成"配音写法"就生效（2026-11-09 晚加）。11-09 晚你耳听 本机资料/试验/读音试听_1109b/ 的试听，原写法和 Tur-nus 都没问题：定为照原写法配音、不启用 Tur-nus（留着备查）；万一又念成 Weston，专名读音清单会自动重录一次

