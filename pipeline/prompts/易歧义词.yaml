# 易歧义词小词表（给 pipeline/ambiguity_check.py 用；fd 第 7 步只提醒、不拦）
#
# 为什么要有它：开场、收尾、视频速览和小结卡的话最短，听众和观众只看到、只听到这一句，前后没有上下文帮着理解。
#   这几个地方一用比喻、行话，就容易读出第二个意思。11-09 视频收尾卡写"程序摆在前面"（本意是董事会先把调查程序摆出来），
#   放在科技新闻里会被读成软件程序；速览"智能体在抢入口""账单落到水和债上"，只看这一屏不知道在说什么。
# 这些词放对了地方没有问题（"安装程序""机场入口"），所以只提醒：看到提醒，读一遍那一句，只看这一句会不会误会；
#   会，就换成具体的名词或数字（"董事会先公布调查怎么查"）；不会，就不用改。
# 小结短语的三关（总规矩第 11 条）：只看这一段的人能懂；放在科技新闻里不会读出第二个意思；至少有一个具体名词或数字。
#
# 怎么改：直接加减下面的条目。每条两个字段：
#   词     要找的词（按字面找，不分词）
#   说明   为什么容易歧义，提醒里原样显示
# 改完跑 python pipeline/test_ambiguity_check.py（只测程序，不测词表内容）。

版本: 2026-11-09（第一版：用户点名 4 个，另补 8 个）

词:
  - 词: 程序
    说明: 本意常是"办事的步骤"，科技新闻里先被读成软件程序
  - 词: 入口
    说明: 比喻"用户从哪里进来"，只看一句像在说门口；要说清是什么的入口（手机助手、搜索框）
  - 词: 账单
    说明: 比喻"代价、成本"，只看一句像在说付款单；要说清是谁的什么成本（电、水、利息）
  - 词: 底座
    说明: 行话"基础模型、底层平台"，只看一句像在说物件的座子
  - 词: 基座
    说明: 同"底座"，行话"基础模型"，听众不一定懂
  - 词: 赛道
    说明: 行话"细分市场"，只看一句像在说体育比赛
  - 词: 闭环
    说明: 行话"从头到尾自己做完"，也是控制论、冷却系统的术语（11-09 有"闭环水冷"），放在小结里意思不定
  - 词: 门槛
    说明: 比喻"要达到的程度"，可能指能力门槛、价格门槛、准入门槛，要说清是哪一种
  - 词: 窗口
    说明: 可能是时间窗口、软件窗口、对外窗口，要说清
  - 词: 护城河
    说明: 行话"别人难以追上的优势"，只看一句像在说城墙
  - 词: 阀门
    说明: 比喻"控制量的开关"（11-08 配图阀门＝买方压价），只看一句像在说管道零件
  - 词: 抢跑
    说明: 比喻"提前行动"，可能被读成违规偷跑
