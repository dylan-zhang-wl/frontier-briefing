     url: "https://raw.githubusercontent.com/Olshansk/rss-feeds/main/feeds/feed_anthropic_news.xml",
     layer: primary_intl, lang: en, region: intl, operator: anthropic, ai_focused: true,
     note: "Anthropic 无官方 RSS；Olshansk/rss-feeds 定时抓网页生成，日期只到天"}
  - {id: anthropic-claude-blog, name: "Claude 博客（社区生成源）", type: rss,
