# frontier-daily 测试版信源清单（2026-10-31）
#
# 用途：fetch.py 按这份清单抓取。一个条目就是一个来源；改来源只改这里，不用动代码。
# 依据：文档/调研/信息源与获取方式.md（10-30 实测），10-31 上午又补测了一轮（见各条 note）。
#
# 字段说明
#   id         来源编号，全清单唯一，写进每条条目的 source_id
#   name       给人看的名字
#   type       抓取方式：rss（RSS／Atom 订阅源）、hn（Hacker News 官方接口）、hf_models（Hugging Face 按组织列新模型）、
#              hf_papers（Hugging Face 每日论文）、github_search（GitHub 搜索接口）、github_org_repos（GitHub 组织新建仓库）、
#              ainews（AINews，另拆出 X 回顾、Reddit 回顾两类社交信号）
#   layer      层级：primary_intl 国际一手｜primary_cn 中国一手｜media_intl 国际媒体与商业｜media_cn 中文媒体｜
#              community 社区信号｜aggregator 二手整合｜lang_edu 语言·翻译·教育｜（social 社交信号，由 ainews 自动产生）
#   lang       来源主要语言（en / zh）；单条的语言由程序按标题再判一次
#   region     cn = 中国来源（中国公司官方渠道、中文媒体）；intl = 国际来源。用来判断"中外都有报道"
#   operator   运营方。同一运营方的多个渠道（如 NVIDIA 博客和 NVIDIA 新闻稿）在热度里只算一个独立来源
#   ai_focused true = 来源本身专讲 AI，粗筛默认保留；false = 综合科技／商业／教育来源，要命中词表才保留
#   paywall    true = 付费墙媒体，只用订阅源里的标题和摘要，不抓正文
#   max_items  每次最多取多少条（按时间倒序），防止大源刷屏
#   exclude_title  标题命中这个正则就丢弃（如测试版、夜间构建）
#   title_prefix   给标题加前缀（GitHub 发版标题只有版本号，看不出是什么产品）
#   roundup    true = 这个来源每条都是多话题汇总（如 TLDR 每期），归并时只记"提及"，不参与合并
#   note       备注（实测情况、已知问题）

defaults:
  since_hours_before_run_day: 36     # 不给 --since 时，窗口起点 = 运行日 00:00 UTC 往前 36 小时（10-31 → 10-29T12:00Z）
  timeout_s: 20                      # 单个请求超时
  retries: 1                         # 失败（超时、网络错误、429、5xx）最多重试一次
  retry_wait_s: 3
  per_host_concurrency: 2            # 同一网站同时最多 2 个请求
  global_concurrency: 12
  user_agent: "Mozilla/5.0 frontier-daily/0.1 (+https://wenlongzhang.com)"   # 自报项目名；10-31 实测 Microsoft Research 会拦另一种写法（403）
  summary_max_chars: 600
  max_items: 60

sources:

