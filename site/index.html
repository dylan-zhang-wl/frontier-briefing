<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F6F2E9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14130F" media="(prefers-color-scheme: dark)">
<!-- 本期数据：依次尝试，先找到的那份生效；也可以用 ?issue=相对路径/issue.js 指定 -->
<meta name="fd-issue" content="issue.js mock/issue.js">
<title>每日前沿简报</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230D636D'/%3E%3Crect x='8' y='20' width='16' height='3' fill='%23FFFCF6'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
<script>
  /* 先按记住的设置定好主题和语言，避免页面闪一下 */
  (function () {
    try {
      var th = localStorage.getItem('fd.theme');
      if (th === 'light' || th === 'dark') document.documentElement.setAttribute('data-theme', th);
      if (localStorage.getItem('fd.lang') === 'en') document.documentElement.lang = 'en';
    } catch (e) { /* storage blocked */ }
  })();
</script>
</head>
<body>
<a class="skip" href="#main">跳到正文</a>
<header class="topbar" id="top">
  <div class="wrap topbar-in">
    <a class="brand" href="#sec-card"><i class="mark" aria-hidden="true"></i><span class="brand-zh">每日前沿简报</span><span class="brand-en">Frontier Daily</span></a>
    <span class="topbar-date" id="topdate"></span>
    <div class="topbar-tools">
      <div class="seg lang" role="group" aria-label="语言">
        <button type="button" data-lang="zh" aria-pressed="true">中</button>
        <button type="button" data-lang="en" aria-pressed="false">EN</button>
      </div>
      <button class="ibtn" type="button" id="themeBtn"></button>
    </div>
  </div>
  <nav class="secnav" aria-label="本页目录"><div class="wrap secnav-in" id="secnav"></div></nav>
</header>
<div id="mockbar"></div>

<main id="main">
  <section class="block block--card" id="sec-card" data-nav="card">
    <div class="wrap">
      <div id="card-root"></div>
      <div class="card-actions">
        <button class="btn btn-primary" type="button" id="dc-save"><span>保存为图片</span></button>
        <span class="card-hint" id="card-hint"></span>
      </div>
    </div>
  </section>

  <section class="block" id="sec-video" data-nav="video">
    <div class="wrap">
      <div id="head-video"></div>
      <div id="video-root"></div>
    </div>
  </section>

  <section class="block" id="sec-podcast" data-nav="podcast">
    <div class="wrap">
      <div id="head-podcast"></div>
      <div id="podcast-root"></div>
    </div>
  </section>

  <div id="stories"></div>

  <section class="block" id="sec-sources" data-nav="sources"><div class="wrap" id="sources-root"></div></section>
  <section class="block" id="sec-about" data-nav="about"><div class="wrap" id="about-root"></div></section>
</main>

<footer class="foot" id="foot"></footer>
<dialog class="share" id="shareDlg"></dialog>
<noscript><p style="max-width:640px;margin:40px auto;padding:0 16px">这个页面需要 JavaScript 才能显示内容。This page needs JavaScript.</p></noscript>

<script src="video.js"></script>
<script src="app.js"></script>
</body>
</html>
