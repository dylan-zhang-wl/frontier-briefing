<!doctype html>
<html lang="zh-CN" data-accent="{{ACCENT}}" data-font="{{BODY_FONT}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{NAME_ZH}} · {{NAME_EN_SHORT}}</title>
<meta name="description" content="{{NAME_ZH}}（{{NAME_EN}}）：今日三件事、今日数字、视频与播客、头条、要闻、快讯、预告看板、国内外对照、今日一词。">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3CradialGradient id='g' cx='.35' cy='.3' r='.8'%3E%3Cstop offset='0' stop-color='%23fff'/%3E%3Cstop offset='.6' stop-color='{{ACCENT_HEX}}'/%3E%3Cstop offset='1' stop-color='{{ACCENT_HEX}}'/%3E%3C/radialGradient%3E%3C/defs%3E%3Ccircle cx='16' cy='16' r='14' fill='url(%23g)'/%3E%3C/svg%3E">
<!-- 字体：都在本站（issues/日期/fonts/，按这一期用到的字截取），不连谷歌字体或任何外网。
     正文西文先用本机 Times New Roman，没有时才下载同尺寸的 Tinos。换到别的日期时，app.js 会换上那一期的字体。 -->
<style id="fd-fonts">
{{FONT_FACES}}
</style>
{{PRELOAD}}
<link rel="stylesheet" href="style.css">
<!-- 先按网址参数 / 上次的选择定好深浅色和语言，免得页面闪一下。
     ?theme=light|dark  ?static=1（截图用：无动画、全部到终态）  ?accent=blue|amber|coral|violet（只预览别的主题色，不保存） -->
<script>
(function () {
  var d = document.documentElement, q;
  try { q = new URLSearchParams(location.search); } catch (e) { q = { get: function () { return null; } }; }
  var mem = function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } };
  var t = q.get('theme') || mem('fd3.theme');
  if (t === 'light' || t === 'dark') d.setAttribute('data-theme', t);
  var a = q.get('accent');
  if (/^(blue|amber|coral|violet)$/.test(a || '')) { d.setAttribute('data-accent', a); d.setAttribute('data-accent-lock', '1'); }
  if (mem('fd.lang') === 'en') d.lang = 'en';
  if (q.get('static') === '1') d.classList.add('static');
  d.classList.add('js');
})();
</script>
</head>
<body>
<!-- 背景：三团很淡的主题色光 + 一层 Canvas 画的点和细线（v3.1“数字层”，由 app.js 画；只是装饰，读屏软件跳过） -->
<div class="bg" id="bg" aria-hidden="true"><i class="blob f1"></i><i class="blob f2"></i><i class="blob f3"></i><canvas class="dots" id="dots"></canvas></div>
<a class="skip" href="#main">跳到正文</a>
<header class="mast wrap" id="top"></header>
<div class="notice wrap" id="notice" hidden></div>
<main id="main" class="wrap" tabindex="-1"><p class="boot">正在载入今天的简报…</p></main>
<footer class="foot wrap" id="foot"></footer>
<div class="tip" id="tip" role="tooltip" hidden></div>
<div class="mini glass" id="mini" hidden></div>
<noscript><p class="boot">这个页面需要启用 JavaScript。</p></noscript>
<!-- 往期目录（日期列表和全站设置）；每一期的数据在 issues/日期/issue.js，由 app.js 按日期加载。
     视频播放器（GSAP＋video2.js）、图表库（ECharts）都等滚到附近才加载，首屏不下载。 -->
<script src="issues/index.js"></script>
<script src="app.js"></script>
</body>
</html>
